<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — cscalculator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="db-config.js"></script><script src="auth.js"></script>
<style>:root{--bg:#0a0a0b;--panel:#131315;--line:#29292d;--text:#f3f1ec;--muted:#8c8c91;--blue:#1d4e73;--red:#d6473c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;min-height:100vh;display:grid;place-items:center;background-image:radial-gradient(ellipse 800px 420px at 50% 0%,rgba(29,78,115,.18),transparent 70%)}.wrap{width:min(430px,calc(100% - 32px))}.brand{margin-bottom:24px}.tag{color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.brand h1{font:600 32px 'Space Grotesk';margin:8px 0}.brand p{color:var(--muted);font-size:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}.field{margin-bottom:17px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}input{width:100%;background:#0e0e10;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:13px 14px;outline:none}input:focus{border-color:var(--blue)}button{width:100%;border:0;border-radius:8px;padding:13px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.msg{min-height:20px;margin-top:14px;font-size:13px;color:#e17b72}.foot{text-align:center;color:#666;font-size:11px;margin-top:18px}</style></head><body><div class="wrap"><div class="brand"><div class="tag">cscalculator · Pré-produção</div><h1>Acesso ao sistema</h1><p>Entre para acessar as calculadoras e seus recursos.</p></div><div class="card"><form id="f"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="senha" type="password" autocomplete="current-password" required></div><button id="b">Entrar</button><div class="msg" id="msg"></div></form></div><div class="foot">Acesso protegido · Supabase Auth</div></div><script>(async()=>{const q=new URLSearchParams(location.search);if(q.get('blocked'))msg.textContent='Este usuário está bloqueado.';const r=await MMAuth.client.auth.getUser();if(r.data&&r.data.user)location.href='index.html';f.onsubmit=async e=>{e.preventDefault();b.disabled=true;msg.textContent='Entrando...';const r=await MMAuth.client.auth.signInWithPassword({email:email.value.trim(),password:senha.value});if(r.error){msg.textContent='E-mail ou senha inválidos.';b.disabled=false;return}await MMAuth.refreshCatalog();location.href='index.html'}})();</script></body></html>
