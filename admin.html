<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — cscalculator</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="db-config.js"></script><script src="auth.js"></script><style>:root{--bg:#0a0a0b;--panel:#131315;--line:#29292d;--text:#f3f1ec;--muted:#8c8c91;--blue:#1d4e73;--ok:#7cae83;--red:#d6473c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}header{border-bottom:1px solid var(--line);padding:34px max(20px,calc((100% - 1100px)/2))}h1,h2{font-family:'Space Grotesk'}h1{margin:8px 0 0}.tag{color:#315b7d;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}main{max-width:1100px;margin:auto;padding:34px 20px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.back{color:var(--muted);text-decoration:none}.grid{display:grid;grid-template-columns:380px 1fr;gap:20px;margin-top:24px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}.field{margin:13px 0}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}input,select{width:100%;background:#0e0e10;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:11px}button{border:0;border-radius:7px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.msg{font-size:12px;min-height:18px;margin-top:10px;color:var(--ok)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px}.pill{padding:3px 7px;border:1px solid var(--line);border-radius:99px;font-size:10px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:11px;padding:6px 8px;background:#242428}</style></head><body><header><div class="tag">06 · Administração</div><h1>Usuários e acessos</h1></header><main><div class="top"><a class="back" href="index.html">← Voltar para áreas</a><button onclick="MMAuth.logout()">Sair</button></div><div class="grid"><section class="card"><h2>Cadastrar terceiro</h2><form id="createForm"><div class="field"><label>Nome</label><input id="nome" required></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha inicial</label><input id="senha" type="password" minlength="6" required></div><div class="field"><label>Perfil</label><select id="role"><option value="user">USER — calculadoras</option></select></div><button>Criar usuário</button><div id="msg" class="msg"></div></form></section><section class="card"><h2>Usuários cadastrados</h2><div style="overflow:auto"><table><thead><tr><th>Nome / e-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table></div></section></div></main><script>
const MASTER_EMAIL='matheussiqueiraprodutor@gmail.com'; let endpoint='';async function callAdmin(action,payload){const s=await MMAuth.client.auth.getSession();const token=s.data.session&&s.data.session.access_token;if(!token)throw Error('Sessão expirada');const r=await fetch(MM_DB_CONFIG.url+'/functions/v1/admin-users',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':MM_DB_CONFIG.publishableKey},body:JSON.stringify(Object.assign({action},payload||{}))});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Erro na função administrativa');return j}
async function load(){const j=await callAdmin('list');tbody.innerHTML=j.users.map(u=>{const master=String(u.email||'').toLowerCase()===MASTER_EMAIL; return `<tr><td><b>${esc(u.full_name||'—')}</b><br><span style="color:var(--muted)">${esc(u.email||'')}</span></td><td><span class="pill">${master?'MASTER': 'USER'}</span></td><td>${u.active?'Ativo':'Bloqueado'}</td><td><div class="actions">${master?'<span style="color:var(--muted);font-size:11px;padding:6px 8px">Conta principal</span>':`<button onclick="setActive('${u.id}',${!u.active})">${u.active?'Bloquear':'Ativar'}</button><button onclick="resetPass('${u.id}')">Senha</button>`}</div></td></tr>`}).join('')}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function setRole(id,role){return false}async function setActive(id,active){await callAdmin('update',{id,active});load()}async function resetPass(id){const password=prompt('Nova senha (mínimo 6 caracteres):');if(password&&password.length>=6){await callAdmin('password',{id,password});alert('Senha alterada.')}}
(async()=>{if(!(await MMAuth.init({admin:true})))return;await load();createForm.onsubmit=async e=>{e.preventDefault();msg.textContent='Criando...';try{await callAdmin('create',{email:email.value.trim(),password:senha.value,full_name:nome.value.trim(),role:'user'});msg.textContent='Usuário criado com sucesso.';createForm.reset();load()}catch(x){msg.textContent=x.message}}})();</script></body></html>
