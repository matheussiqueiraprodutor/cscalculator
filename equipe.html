<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar Equipe — HIVE PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="db-config.js"></script><script src="auth.js"></script>
<style>:root{--bg:#03070d;--panel:#071019;--line:#183044;--text:#f4f7fa;--muted:#8495a6;--blue:#00a3ff;--ok:#35d99a;--warn:#ffe17a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}header{border-bottom:1px solid rgba(0,163,255,.18);padding:30px max(20px,calc((100% - 1100px)/2))}h1,h2,h3{font-family:'Space Grotesk'}h1{margin:7px 0 0}.tag{color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}main{max-width:1100px;margin:auto;padding:30px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:var(--muted);text-decoration:none}.grid{display:grid;grid-template-columns:390px 1fr;gap:20px;margin-top:22px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card{background:linear-gradient(145deg,#08121d,#050b12);border:1px solid var(--line);border-radius:14px;padding:22px}.field{margin:13px 0}label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}input,select{width:100%;background:#050c13;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}button{border:0;border-radius:8px;padding:10px 13px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.secondary{background:#152431}.need{display:grid;grid-template-columns:1fr 72px auto;gap:8px;margin:8px 0}.result{border-top:1px solid var(--line);padding:16px 0}.result:first-child{border-top:0}.candidate{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;margin:6px 0;background:#050c13;border:1px solid var(--line);border-radius:8px}.p1{color:var(--warn)}.muted{color:var(--muted);font-size:12px}.msg{color:var(--ok);font-size:12px;margin-top:10px;min-height:18px}.review{margin-top:8px}.review textarea{width:100%;min-height:90px;background:#050c13;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.actions button{font-size:11px;padding:7px}.status{font-size:10px;margin-left:8px}</style></head><body>
<header><div class="tag">09 · Equipe</div><h1>Solicitar Equipe</h1></header><main><div class="top"><a class="back" href="index.html">← Voltar para áreas</a><button class="secondary" onclick="MMAuth.logout()">Sair</button></div>
<div class="grid"><section class="card"><h2>Necessidade do evento</h2><div class="field"><label>Evento</label><input id="eventName"></div><div class="field"><label>Data</label><input id="eventDate" placeholder="dd/mm/aaaa"></div><div class="field"><label>Local</label><input id="eventLocation"></div><div class="field"><label>Funções necessárias</label><div id="needs"></div><button class="secondary" type="button" id="addNeed">+ Adicionar função</button></div><button id="build" type="button">Montar ordem de contato</button><div id="msg" class="msg"></div></section>
<section class="card"><h2>Ordem sugerida</h2><p class="muted">O Hive Pro lista profissionais ativos pela prioridade cadastrada. Nenhuma mensagem é enviada nesta etapa.</p><div id="results"><div class="muted">Informe a equipe necessária para gerar a ordem.</div></div></section></div></main>
<script>
let functions=[],freelancers=[];const sectorName={audio:'Áudio',luz:'Iluminação',video:'Vídeo'};
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function options(sel){return functions.filter(f=>f.active).map(f=>'<option value="'+f.id+'" '+(String(sel)===String(f.id)?'selected':'')+'>'+sectorName[f.sector]+' · '+esc(f.name)+'</option>').join('')}
function addNeedRow(){const r=document.createElement('div');r.className='need';r.innerHTML='<select class="fn"><option value="">Selecione...</option>'+options()+'</select><input class="qty" type="number" min="1" max="99" value="1"><button class="secondary" type="button">×</button>';r.querySelector('button').onclick=()=>r.remove();needs.appendChild(r)}
function loadHeader(){try{const d=JSON.parse(localStorage.getItem('descritivo_cabecalho')||'{}');eventName.value=d.evento||'';eventDate.value=d.dataEvento||'';eventLocation.value=d.local||''}catch(e){}}
async function initData(){let r=await MMAuth.client.from('freelancer_functions').select('*').order('sector').order('sort_order');if(r.error)throw r.error;functions=r.data||[];r=await MMAuth.client.from('freelancers').select('id,full_name,whatsapp,active,freelancer_skills(function_id,priority,active)').eq('active',true).order('full_name');if(r.error)throw r.error;freelancers=r.data||[]}
function candidates(functionId){return freelancers.map(f=>{const s=(f.freelancer_skills||[]).find(x=>x.active&&Number(x.function_id)===Number(functionId));return s?{id:f.id,name:f.full_name,whatsapp:f.whatsapp,priority:s.priority}:null}).filter(Boolean).sort((a,b)=>a.priority-b.priority||a.name.localeCompare(b.name))}
build.onclick=async()=>{msg.textContent='';const selected=[...document.querySelectorAll('.need')].map(r=>({function_id:Number(r.querySelector('.fn').value),quantity:Number(r.querySelector('.qty').value)})).filter(x=>x.function_id&&x.quantity>0);if(!selected.length){msg.textContent='Adicione pelo menos uma função.';return}if(new Set(selected.map(x=>x.function_id)).size!==selected.length){msg.textContent='A mesma função foi adicionada mais de uma vez.';return}const blocks=selected.map(n=>{const fn=functions.find(f=>Number(f.id)===n.function_id),cs=candidates(n.function_id);return '<div class="result"><h3>'+esc(sectorName[fn.sector])+' · '+esc(fn.name)+' <span class="muted">('+n.quantity+' vaga'+(n.quantity>1?'s':'')+')</span></h3>'+(cs.length?cs.map((c,i)=>'<div class="candidate"><div><b>'+esc(c.name)+'</b><br><span class="muted">'+esc(c.whatsapp)+'</span></div><div class="'+(c.priority===1?'p1':'')+'">P'+c.priority+' · #'+(i+1)+'</div></div>').join(''):'<div class="muted">Nenhum profissional ativo cadastrado para esta função.</div>')+'</div>'});results.innerHTML=blocks.join('');try{const req=await MMAuth.client.from('staffing_requests').insert({event_name:eventName.value.trim(),event_date:eventDate.value.trim(),event_location:eventLocation.value.trim(),status:'ready',created_by:MMAuth.user.id}).select('id').single();if(req.error)throw req.error;const ins=await MMAuth.client.from('staffing_request_items').insert(selected.map(x=>({request_id:req.data.id,function_id:x.function_id,quantity:x.quantity}))).select('id,function_id,quantity');if(ins.error)throw ins.error;for(const item of ins.data){const fn=functions.find(f=>Number(f.id)===Number(item.function_id)),cs=candidates(item.function_id);if(!cs.length)continue;const cr=await MMAuth.client.from('staffing_candidates').insert(cs.map((x,i)=>({request_item_id:item.id,freelancer_id:x.id,priority:x.priority,contact_order:i+1,message_text:messageFor(x.name,fn.name)}))).select('id,freelancer_id');if(cr.error)throw cr.error;const block=[...results.querySelectorAll('.result')].find(x=>x.querySelector('h3')&&x.querySelector('h3').textContent.includes(fn.name));if(block)cr.data.forEach(s=>{const x=cs.find(z=>z.id===s.freelancer_id),card=[...block.querySelectorAll('.candidate')].find(k=>k.textContent.includes(x.name));if(card){card.querySelector('div:last-child').insertAdjacentHTML('beforeend',' <span class="status">PENDENTE</span>');card.insertAdjacentHTML('beforeend','<div class="review"><textarea>'+esc(messageFor(x.name,fn.name))+'</textarea><div class="actions"><button onclick="saveReview('+s.id+',this)">Aprovar mensagem</button><button class="secondary" onclick="candidateStatus('+s.id+',\'available\',this)">Disponível</button><button class="secondary" onclick="candidateStatus('+s.id+',\'unavailable\',this)">Indisponível</button></div></div>')}})}msg.textContent='Solicitação salva. Mensagens prontas para revisão.'}catch(e){msg.textContent=e.message}}
addNeed.onclick=addNeedRow;(async()=>{if(!(await MMAuth.init({admin:true})))return;try{await initData();loadHeader();addNeedRow()}catch(e){msg.textContent=e.message}})();
function messageFor(n, fn) {
  return 'Olá, ' + n + '! Temos o evento ' + (eventName.value || '[evento]') +
    ' no dia ' + (eventDate.value || '[data]') +
    ', em ' + (eventLocation.value || '[local]') +
    '. Precisamos de ' + fn + '. Você tem disponibilidade?';
}

async function candidateStatus(id, status, el) {
  const payload = { status };
  if (status === 'available' || status === 'unavailable') {
    payload.responded_at = new Date().toISOString();
  }
  const r = await MMAuth.client.from('staffing_candidates').update(payload).eq('id', id);
  if (r.error) {
    msg.textContent = r.error.message;
    return;
  }
  const badge = el.closest('.candidate').querySelector('.status');
  badge.textContent =
    status === 'available' ? 'DISPONÍVEL' :
    status === 'unavailable' ? 'INDISPONÍVEL' : 'AGUARDANDO';
}

async function saveReview(id, el) {
  const box = el.closest('.candidate');
  const ta = box.querySelector('textarea');
  const r = await MMAuth.client.from('staffing_candidates').update({
    message_text: ta.value,
    status: 'waiting',
    contacted_at: new Date().toISOString()
  }).eq('id', id);
  msg.textContent = r.error
    ? r.error.message
    : 'Mensagem aprovada. Envio real aguardará a conexão com a API do WhatsApp.';
  if (!r.error) box.querySelector('.status').textContent = 'AGUARDANDO';
}
</script></body></html>
